name: QuickShare Cross-Platform CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./quickshare
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --fatal-infos

      # The raw logs need a GitHub account, so a red run used to say "6
      # failed" and nothing about which six — useless to anyone the builds are
      # published for. The step summary is public, so the names go there.
      - name: Run unit and integration tests
        run: |
          set -o pipefail
          flutter test --coverage 2>&1 | tee /tmp/test-output.txt

      - name: Name the failures
        if: failure()
        run: |
          # Annotations, because those are what the run page and the API show
          # without an account — and the names of the failures are the whole
          # point of looking at a red run.
          #
          # Matched on the reporter's own "[E]" marker rather than the
          # "Failing tests:" block: that block is printed only to a terminal,
          # and CI is not one, so grepping for it found nothing at all.
          grep -F '[E]' /tmp/test-output.txt | head -40 \
            | while IFS= read -r line; do
                echo "::error::$line"
              done
          {
            echo '### Failing tests'
            echo '```'
            grep -F '[E]' /tmp/test-output.txt | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build_macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./quickshare
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Build macOS Application
        run: |
          flutter pub get
          flutter build macos --debug --no-pub

  # iOS ships in the release matrix but had no build here at all, so the only
  # thing standing between a typo in Runner/*.swift and a failed archive on
  # somebody's Mac was remembering to open Xcode. Codesigning is skipped —
  # this is a compile check, not a distribution build.
  build_ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./quickshare
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Build iOS Application
        run: |
          flutter pub get
          flutter build ios --release --no-codesign --no-pub

  build_android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./quickshare
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Build Android APK (debug)
        run: |
          flutter pub get
          flutter build apk --debug --no-pub

      # Release is built on every push so the signing path, R8 and the network
      # security config are exercised — a debug-only pipeline is exactly how
      # the previous release breakage went unnoticed.
      #
      # Signing material comes from repository secrets. Without them the build
      # still runs and produces an unsigned APK rather than silently falling
      # back to the debug certificate.
      #
      # Missing secrets mean different things depending on the trigger. On a
      # push to a release branch or a tag, they are a misconfiguration that
      # would ship an unsigned build — fail. On a pull request (a fork cannot
      # read repository secrets at all) it only means this run cannot produce
      # a publishable artifact — warn, build unsigned to exercise the path,
      # and let the upload step skip it.
      # The secrets context is not reliably usable in a step-level `if`, so the
      # value is read into an env var and the check happens in shell.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.QUICKSHARE_KEYSTORE_BASE64 }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "QUICKSHARE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNED=true" >> "$GITHUB_ENV"
          elif [ "$EVENT_NAME" = "push" ]; then
            echo "::error::No keystore secret configured on a $EVENT_NAME — a release build must be signed."
            exit 1
          else
            echo "::warning::No keystore secret (expected on a fork PR) — building an unsigned APK; it will not be uploaded."
            echo "RELEASE_SIGNED=false" >> "$GITHUB_ENV"
          fi

      # Per-ABI APKs rather than one fat binary. The universal APK is 102 MB
      # because it carries libflutter, libjingle_peerconnection and the ML Kit
      # barcode models three times over; a device only ever needs one set.
      - name: Build Android APKs (release, per ABI)
        env:
          QUICKSHARE_KEYSTORE_PASSWORD: ${{ secrets.QUICKSHARE_KEYSTORE_PASSWORD }}
          QUICKSHARE_KEY_ALIAS: ${{ secrets.QUICKSHARE_KEY_ALIAS }}
          QUICKSHARE_KEY_PASSWORD: ${{ secrets.QUICKSHARE_KEY_PASSWORD }}
        run: flutter build apk --release --no-pub --split-per-abi

      # What Play actually wants; it serves each device only its own slice.
      - name: Build Android App Bundle (release)
        env:
          QUICKSHARE_KEYSTORE_PASSWORD: ${{ secrets.QUICKSHARE_KEYSTORE_PASSWORD }}
          QUICKSHARE_KEY_ALIAS: ${{ secrets.QUICKSHARE_KEY_ALIAS }}
          QUICKSHARE_KEY_PASSWORD: ${{ secrets.QUICKSHARE_KEY_PASSWORD }}
        run: flutter build appbundle --release --no-pub

      # Only a signed build is uploadable. An unsigned PR build has done its
      # job by compiling; publishing it as an artifact is how one gets picked
      # up and shipped by mistake.
      - name: Upload release artifacts
        if: env.RELEASE_SIGNED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            quickshare/build/app/outputs/flutter-apk/*-release.apk
            quickshare/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
