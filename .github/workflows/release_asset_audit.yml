name: Verify published release installation
on:
  push:
    branches: ['codex/release-asset-audit-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-installed-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api-level: [24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download and verify actual public APK
        run: |
          mkdir -p audit
          curl --fail --location --retry 3 https://github.com/Graimon31/QuickShare/releases/download/all-platforms-2026-11-09-cdb1651/DirectDrop-android-x86_64.apk -o audit/release.apk
          echo '6762a5a381a2482b811d1c9493d9bec8ab6d4349cb081bc2002451a2a4ac9db1  audit/release.apk' | sha256sum -c -
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$signer" verify --verbose --print-certs audit/release.apk | tee audit/apk-signature.txt
          grep -qi c662c27391d44f2c58ec9cede1fe18695a5d457f8d4bb0da1ec2304d3477e97a audit/apk-signature.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash quickshare/scripts/release_audit/android_installed_release.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-api-${{ matrix.api-level }}-installation-audit
          path: audit
