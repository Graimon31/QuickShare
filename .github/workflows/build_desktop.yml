name: Build Desktop Applications

on:
  push:
    branches: [ main, master, 'fix/**', 'feat/**' ]
    # A pushed tag like v1.0.0 is what turns this build into a public
    # download: see the release job below.
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Artifacts uploaded within a run need no permission to exist, but they stay
# behind a GitHub login — which is the whole problem a Release solves, and
# publishing one is what needs write access to the repo.
permissions:
  contents: read

jobs:
  build_desktop_macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./quickshare
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Build macOS Release Bundle
        run: |
          flutter pub get
          flutter build macos --release

      # Drag-to-Applications disk image. An .app is a bundle: zip from a
      # non-Mac tool can drop Finder metadata. ditto + hdiutil keep it intact.
      - name: Package macOS DMG
        working-directory: ./quickshare
        run: |
          mkdir -p dist/macos
          STAGE="$(mktemp -d)"
          ditto build/macos/Build/Products/Release/DirectDrop.app \
            "$STAGE/DirectDrop.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create \
            -volname "DirectDrop" \
            -srcfolder "$STAGE" \
            -ov -format UDZO \
            dist/macos/DirectDrop-macos.dmg
          rm -rf "$STAGE"
          ls -lh dist/macos/DirectDrop-macos.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: DirectDrop-macos
          path: quickshare/dist/macos/DirectDrop-macos.dmg
          retention-days: 30

  build_desktop_linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./quickshare
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Build Linux Bundle
        run: |
          flutter pub get
          flutter build linux --release

      - name: Package Linux Bundle
        run: |
          cd build/linux/x64/release/bundle
          tar -czf "$GITHUB_WORKSPACE/quickshare/DirectDrop-linux-x64.tar.gz" .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: DirectDrop-linux
          path: quickshare/DirectDrop-linux-x64.tar.gz

  build_desktop_windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./quickshare
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Build Windows Bundle
        env:
          # Same reason as CMAKE_DISABLE_FIND_PACKAGE_JNI in windows/CMakeLists.txt:
          # a JDK on the runner makes package:jni try to compile dartjni.dll.
          JAVA_HOME: ""
        run: |
          flutter pub get
          flutter build windows --release

      # Flutter links the app against the Visual C++ runtime but does not
      # bundle it — the exe runs fine here because this runner has Visual
      # Studio installed and the DLLs sit in the system path, and then fails
      # on an ordinary user's machine with "side-by-side configuration is
      # incorrect", which is Windows's way of saying vcruntime140.dll and
      # friends are missing. Nearly every first-time Flutter Windows build
      # hits this; "portable" is not true until these travel with the exe.
      - name: Bundle the Visual C++ runtime
        working-directory: ./quickshare
        shell: pwsh
        run: |
          # Fail loudly rather than silently: a Copy-Item that finds nothing
          # is a non-terminating error by default in PowerShell and would
          # otherwise leave this step green with an artifact that is still
          # broken — which is exactly what shipped in v1.0.1. Nobody should
          # find that out on a machine three time zones away again.
          $ErrorActionPreference = 'Stop'

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -property installationPath
          if (-not $vsPath) { throw "vswhere found no Visual Studio installation" }

          # The CRT folder is two levels below the redist version folder
          # (<version>\x64\Microsoft.VCnnn.CRT), not one — a non-recursive
          # search here is what silently found nothing last time.
          $crtDir = Get-ChildItem -Path "$vsPath\VC\Redist\MSVC" -Recurse -Directory -Filter "Microsoft.VC*.CRT" |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crtDir) { throw "Could not find an x64 CRT redistributable folder under $vsPath" }

          $dlls = Get-ChildItem -Path $crtDir.FullName -Filter "*.dll"
          if ($dlls.Count -eq 0) { throw "$($crtDir.FullName) contained no DLLs" }

          Copy-Item -Path $dlls.FullName -Destination "build\windows\x64\runner\Release" -Force
          Write-Host "Bundled $($dlls.Count) runtime DLL(s) from: $($crtDir.FullName)"
          $dlls | ForEach-Object { Write-Host "  $($_.Name)" }

      # Flutter's Windows output is otherwise already portable: an .exe
      # beside its DLLs and a data/ folder, nothing installed and nothing
      # written to the registry. The archive just needs saying so.
      - name: Package portable build
        working-directory: ./quickshare
        shell: pwsh
        run: |
          $out = "build\windows\x64\runner\Release"
          @"
          DirectDrop — portable build

          Run directdrop.exe. Nothing is installed and nothing is written to
          the registry; the whole folder is the application. Keep it together
          — the .exe needs the DLLs and the data folder beside it.

          Windows SmartScreen will warn on first run, because this build is
          not signed with a code-signing certificate. Choose "More info" then
          "Run anyway".
          "@ | Out-File -FilePath "$out\README.txt" -Encoding utf8
          New-Item -ItemType Directory -Force -Path dist\windows | Out-Null
          Compress-Archive -Path "$out\*" -DestinationPath "$PWD\dist\windows\DirectDrop-windows-portable.zip"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        working-directory: ./quickshare
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\windows | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          # The version lives in pubspec.yaml once; a hardcoded copy here is
          # one forgotten bump away from an installer that lies.
          $version = (Get-Content pubspec.yaml | Select-String -Pattern '^version: ([0-9.]+)').Matches.Groups[1].Value
          if (-not $version) { throw "Could not read the version from pubspec.yaml" }
          & $iscc /DMyAppVersion=$version packaging\windows\directdrop.iss
          Get-ChildItem dist\windows | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: DirectDrop-windows-portable
          path: quickshare/dist/windows/DirectDrop-windows-portable.zip
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: DirectDrop-windows-setup
          path: quickshare/dist/windows/DirectDrop-windows-setup.exe
          retention-days: 30

  # What only a Windows machine can say about the storage layer: the Win32
  # free-space call, junctions and symbolic links, NTFS rename semantics,
  # MAX_PATH, reserved device names, a genuinely full volume (a small VHD, which
  # diskpart can mount because this runner is an administrator) and a QHTP
  # transfer with resume on NTFS. The first step is required; the second is a
  # first look at how the whole suite behaves on Windows and does not gate
  # anything. `release` deliberately does not wait for this job: a red run here
  # is a finding to read, not a reason to hold a tagged build.
  test_windows_native:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./quickshare
    # Same reason as in the build job: a JDK on the runner makes package:jni
    # try to compile dartjni.dll.
    env:
      JAVA_HOME: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Windows native tests
        run: flutter test --no-pub test/platform/windows_native_test.dart --reporter=expanded

      - name: Full test suite on Windows (first look, does not gate)
        continue-on-error: true
        run: flutter test --no-pub

  # Android answers to the same tag the desktop builds do: its APKs were
  # built in ci.yml and stayed there as run artifacts, invisible to the
  # Release a user downloads from. Built here instead, they sit one
  # download-artifact step away from the public page. ci.yml keeps its own
  # Android job for branch/PR compile checks; this one exists to feed the
  # release, so tags and manual runs only.
  build_android:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./quickshare
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      # Same signing contract as ci.yml's Android job: a tag build without
      # the keystore is a misconfiguration to fail on, not an unsigned
      # release to ship.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.QUICKSHARE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "QUICKSHARE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::error::No keystore secret configured on a tag build — a release build must be signed."
            exit 1
          fi

      # Per-ABI APKs rather than one fat binary: a device only ever needs one
      # set of the native libraries, and the universal APK carries three.
      - name: Build Android APKs (release, per ABI) and App Bundle
        env:
          QUICKSHARE_KEYSTORE_PASSWORD: ${{ secrets.QUICKSHARE_KEYSTORE_PASSWORD }}
          QUICKSHARE_KEY_ALIAS: ${{ secrets.QUICKSHARE_KEY_ALIAS }}
          QUICKSHARE_KEY_PASSWORD: ${{ secrets.QUICKSHARE_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter build apk --release --no-pub --split-per-abi
          flutter build appbundle --release --no-pub

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            quickshare/build/app/outputs/flutter-apk/*-release.apk
            quickshare/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

  # Run artifacts are only ever visible to someone logged in with access to
  # the repo — that is what today's "why can't they download it" was. A
  # Release attaches the same files to a public page instead, so this only
  # fires for a version tag rather than every ordinary push.
  #
  release:
    needs: [ build_desktop_windows, build_desktop_macos, build_desktop_linux, build_android ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The tag is the version the download page claims; pubspec is the one
      # the app reports. A build whose about-screen disagrees with its
      # release page is how "which version are you on" stops having an answer.
      - name: Guard the tag against pubspec's version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pubspec=$(grep -m1 '^version: ' quickshare/pubspec.yaml | sed -E 's/^version: ([0-9.]+).*/\1/')
          if [ "$tag" != "$pubspec" ]; then
            echo "::error::Tag v$tag but pubspec.yaml says $pubspec — bump one before tagging."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: DirectDrop-windows-portable
          path: dist/windows

      - uses: actions/download-artifact@v4
        with:
          name: DirectDrop-windows-setup
          path: dist/windows

      - uses: actions/download-artifact@v4
        with:
          name: DirectDrop-macos
          path: dist/macos

      - uses: actions/download-artifact@v4
        with:
          name: DirectDrop-linux
          path: dist/linux

      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: dist/android

      # Gradle names binaries for Gradle. A person choosing an APK needs the
      # phone's architecture in the filename, not the build variant's.
      - name: Name the APKs for people, not Gradle
        run: |
          cd dist/android
          mv app-arm64-v8a-release.apk DirectDrop-android-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk DirectDrop-android-armeabi-v7a.apk
          mv app-x86_64-release.apk DirectDrop-android-x86_64.apk
          rm -f ./*.aab

      - name: Generate checksums
        run: |
          (
            (cd dist/windows && sha256sum DirectDrop-windows-portable.zip DirectDrop-windows-setup.exe)
            (cd dist/macos && sha256sum DirectDrop-macos.dmg)
            (cd dist/linux && sha256sum DirectDrop-linux-x64.tar.gz)
            (cd dist/android && sha256sum *.apk)
          ) > dist/SHA256SUMS

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/windows/DirectDrop-windows-setup.exe
            dist/windows/DirectDrop-windows-portable.zip
            dist/macos/DirectDrop-macos.dmg
            dist/linux/DirectDrop-linux-x64.tar.gz
            dist/android/DirectDrop-android-arm64-v8a.apk
            dist/android/DirectDrop-android-armeabi-v7a.apk
            dist/android/DirectDrop-android-x86_64.apk
            dist/SHA256SUMS
          body: |
            **Windows installer** — **DirectDrop-windows-setup.exe**. Run it
            and follow the wizard. Windows SmartScreen will warn on first run
            (this build is not code-signed): "More info" → "Run anyway".

            **Windows portable** — **DirectDrop-windows-portable.zip**. Extract
            anywhere and run `directdrop.exe`. Nothing is installed and
            nothing is written to the registry.

            **macOS** — **DirectDrop-macos.dmg**. Open the disk image and drag
            DirectDrop to Applications. The build is not notarized, so
            Gatekeeper may refuse the first launch: right-click the app and
            choose Open, or run
            `xattr -dr com.apple.quarantine /Applications/DirectDrop.app`.

            **Linux** — **DirectDrop-linux-x64.tar.gz**. Extract and run
            `./directdrop`. Needs GTK 3. x86-64 only.

            **Android** — install the APK matching the phone's architecture:
            **DirectDrop-android-arm64-v8a.apk** is right for virtually every
            phone made since 2017; armeabi-v7a covers old 32-bit devices and
            x86_64 covers emulators and Chromebooks. Android asks once to
            allow installs from the browser or file manager that opens it.
