name: Build Desktop Applications

on:
  push:
    branches: [ main, master, 'fix/**', 'feat/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_desktop_macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./quickshare
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Build macOS Debug Bundle
        run: |
          flutter pub get
          flutter build macos --debug

  build_desktop_linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./quickshare
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Build Linux Bundle
        run: |
          flutter pub get
          flutter build linux --debug

  build_desktop_windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./quickshare
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Build Windows Bundle
        run: |
          flutter pub get
          flutter build windows --release

      # Flutter's Windows output is already portable: an .exe beside its DLLs
      # and a data/ folder, nothing installed and nothing written to the
      # registry. The archive just needs saying so.
      - name: Package portable build
        working-directory: ./quickshare
        shell: pwsh
        run: |
          $out = "build\windows\x64\runner\Release"
          @"
          DirectDrop — portable build

          Run directdrop.exe. Nothing is installed and nothing is written to
          the registry; the whole folder is the application. Keep it together
          — the .exe needs the DLLs and the data folder beside it.

          Windows SmartScreen will warn on first run, because this build is
          not signed with a code-signing certificate. Choose "More info" then
          "Run anyway".
          "@ | Out-File -FilePath "$out\README.txt" -Encoding utf8
          Compress-Archive -Path "$out\*" -DestinationPath "$PWD\..\DirectDrop-windows-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: DirectDrop-windows-portable
          path: DirectDrop-windows-portable.zip
          retention-days: 30
