name: Windows build

# Windows binaries cannot be produced from a Mac: the Flutter toolchain
# refuses outright ("build windows only supported on Windows hosts"), and no
# cross-compilation exists. A Windows runner is the only way to get one
# without a Windows machine on the desk.
on:
  push:
    branches: [main, 'fix/**', 'feat/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      # Run before building: a Windows failure that is really a Dart failure
      # is worth naming as one.
      - name: Tests
        run: flutter test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build
        run: flutter build windows --release

      # What Flutter produces here is already portable: an .exe beside its
      # DLLs and a data/ folder, with nothing written to the registry and
      # nothing to install. Copy it anywhere, including a USB stick, and run.
      - name: Package portable build
        shell: pwsh
        run: |
          $out = "build\windows\x64\runner\Release"
          @"
          DirectDrop — portable build

          Run directdrop.exe. Nothing is installed and nothing is written to
          the registry; the whole folder is the application. Keep it together —
          the .exe needs the DLLs and the data folder beside it.

          Windows SmartScreen will warn on first run, because this build is not
          signed with a code-signing certificate. Choose "More info" then "Run
          anyway".
          "@ | Out-File -FilePath "$out\README.txt" -Encoding utf8
          Compress-Archive -Path "$out\*" -DestinationPath DirectDrop-windows-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DirectDrop-windows-portable
          path: DirectDrop-windows-portable.zip
          retention-days: 30
