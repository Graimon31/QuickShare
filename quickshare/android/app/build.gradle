plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0.0'

// Release signing material, in order of precedence:
//   1. environment variables  — how CI supplies it, straight from secrets
//   2. android/key.properties — how a developer supplies it locally
//
// Neither the keystore nor the passwords live in the repository, and
// key.properties is gitignored. When nothing is configured the release build
// *fails* rather than falling back to the debug key or shipping unsigned: an
// APK signed with the debug certificate cannot be published, cannot be
// upgraded over a real release, and looks valid until the store rejects it.
// The one exception is ALLOW_UNSIGNED_RELEASE=1, which CI sets on the fork-PR
// path where the build only has to compile.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def resolveSigning = { String envName, String propName ->
    return System.getenv(envName) ?: keystoreProperties.getProperty(propName)
}

def signingStorePath = resolveSigning('QUICKSHARE_KEYSTORE', 'storeFile')
def signingStorePassword = resolveSigning('QUICKSHARE_KEYSTORE_PASSWORD', 'storePassword')
def signingKeyAlias = resolveSigning('QUICKSHARE_KEY_ALIAS', 'keyAlias')
def signingKeyPassword = resolveSigning('QUICKSHARE_KEY_PASSWORD', 'keyPassword')

def hasReleaseSigning = signingStorePath != null &&
        signingStorePassword != null &&
        signingKeyAlias != null &&
        signingKeyPassword != null &&
        file(signingStorePath).exists()

android {
    namespace "com.directdrop.app"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.directdrop.app"
        minSdk 24
        targetSdk 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(signingStorePath)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // R8 is off, and the decision is measured rather than assumed.
            // Decomposing the release APK showed 94% of it is native .so
            // libraries across three ABIs; dex is 2%. Turning R8 on moved the
            // total from 101.9 MB to 102.1 MB — it costs 0.7 MB of dex through
            // proguard-android-optimize's inlining and saves nothing, while
            // adding a class of failure that only appears at runtime when a
            // keep rule misses a JNI or reflection entry point in
            // flutter_webrtc, universal_ble or ML Kit.
            //
            // Download size is solved instead by --split-per-abi and the app
            // bundle: 37.6 MB for arm64 against 102.1 MB universal.
            //
            // proguard-rules.pro stays in the tree. Flip these two flags back
            // on once someone has installed app-arm64-v8a-release.apk on a real
            // device and exercised the scanner, Bluetooth and internet screens.
            minifyEnabled false
            shrinkResources false

            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                // No key material. The build is not stopped here — that would
                // also break a debug build, which configures this block too —
                // it is stopped below, only when a task that actually
                // produces a release artifact is scheduled.
                signingConfig null
            }
        }
    }
}

// Fail a release build that has no signing, unless it was asked for unsigned
// on purpose.
//
// A plain `flutter build apk --release` with no keys used to print a note and
// hand back an unsigned APK — valid-looking until Play rejects it, upgradable
// over nothing. The only legitimate unsigned release is a fork PR in CI,
// which cannot read the signing secrets and sets ALLOW_UNSIGNED_RELEASE=1.
//
// The check runs at task-graph time rather than configuration time so it sees
// which build was requested and leaves debug builds alone.
gradle.taskGraph.whenReady { graph ->
    def wantsRelease = graph.allTasks.any { task ->
        def n = task.name
        (n.contains('Release') || n.contains('release')) &&
            (n.startsWith('assemble') || n.startsWith('bundle') ||
             n.startsWith('package') || n.startsWith('lintVital'))
    }
    def allowUnsigned = System.getenv('ALLOW_UNSIGNED_RELEASE') == '1'
    if (wantsRelease && !hasReleaseSigning && !allowUnsigned) {
        throw new GradleException(
                "No release signing configured. Set QUICKSHARE_KEYSTORE / " +
                "QUICKSHARE_KEYSTORE_PASSWORD / QUICKSHARE_KEY_ALIAS / " +
                "QUICKSHARE_KEY_PASSWORD, or create android/key.properties " +
                "from key.properties.example. To build unsigned on purpose, " +
                "set ALLOW_UNSIGNED_RELEASE=1.")
    }
    if (wantsRelease && !hasReleaseSigning && allowUnsigned) {
        println("DirectDrop: ALLOW_UNSIGNED_RELEASE=1 — building an UNSIGNED " +
                "release deliberately.")
    }
}

flutter {
    source '../..'
}
