org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
# Jetifier rewrites legacy support-library jars to AndroidX. Nothing in this
# project's dependency tree ships pre-AndroidX libraries anymore, so the
# transform only cost time and heap — it OOM'd the CI runner's 2 GB daemon
# (JetifyTransform "Java heap space" on the Flutter engine jars).
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
