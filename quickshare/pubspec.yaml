name: quickshare
description: P2P file transfer app via QR code over local network.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  animations: ^2.0.11
  desktop_drop: ^0.7.1

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.2.7

  # Dependency Injection
  get_it: ^7.7.0

  # HTTP Server (Sender)
  shelf: ^1.4.1
  shelf_router: ^1.1.4

  # HTTP Client (Receiver)
  dio: ^5.7.0

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # File Handling
  file_picker: ^8.1.2
  image_picker: '>=1.1.2 <1.2.0'
  path_provider: ^2.1.4
  open_file: ^3.5.6
  archive: ^3.6.1

  # Permissions
  permission_handler: ^11.3.1

  # Network
  network_info_plus: ^6.0.1

  # Crypto / Utils
  uuid: ^4.5.0
  crypto: ^3.0.5
  mime: ^2.0.0
  path: ^1.9.0

  # Wakelock
  wakelock_plus: ^1.2.8

  # WebRTC & WebSockets
  flutter_webrtc: ^0.12.4
  web_socket_channel: ^3.0.1

  app_links: ^7.2.1

  # Cross-platform BLE peripheral mode for Android and Windows senders.
  universal_ble: ^2.1.1
  dbus: ^0.7.14
  cryptography: ^2.9.0
  gal: ^2.3.3
  photo_manager: ^3.12.0
  photo_manager_image_provider: ^2.2.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  # Real WebRTC needs platform channels, which the headless runner has none of.
  # These tests run on a device or, as it turns out, on the macOS desktop
  # target — which is enough to exercise ICE, DTLS and the DataChannel for
  # real without any phone in the room.
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.7
  # Deterministic time for the hotspot lifecycle tests: "two minutes later"
  # has to be exact, and a real delay would make the suite slow and flaky.
  fake_async: ^1.3.1
  mocktail: ^1.0.4
  wakelock_plus_platform_interface: ^1.6.0

flutter:
  uses-material-design: true
  generate: true
